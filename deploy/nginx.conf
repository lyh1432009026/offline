# 内网离线资源库 · Nginx 独立配置示例
# 用法：nginx -c /srv/offline-hub/deploy/nginx.conf
# 部署前把下方 root 改成实际目录；Windows 路径写成 F:/我的文档/离线方案

worker_processes auto;
error_log  logs/offline-hub-error.log warn;
pid        logs/offline-hub.pid;

events {
    worker_connections 1024;
}

http {
    # 一次性定义完整 MIME：.mjs / .wasm / .terrain 等类型若返回 text/plain，
    # 会被浏览器 Strict MIME 检查拦截，表现为 Worker 加载失败、模型白屏。
    types {
        text/html                             html htm;
        text/css                              css;
        text/plain                            txt md;
        application/javascript                js mjs cjs;
        application/json                      json map;
        application/wasm                      wasm;
        application/pdf                       pdf;
        application/xml                       xml;
        application/octet-stream              bin dat tgz gz br lz4;
        application/vnd.apache.parquet        parquet;
        font/woff                             woff;
        font/woff2                            woff2;
        application/x-font-ttf                ttf;
        image/png                             png;
        image/jpeg                            jpg jpeg;
        image/gif                             gif;
        image/webp                            webp;
        image/svg+xml                         svg;
        image/x-icon                          ico;
        model/gltf-binary                     glb;
        model/gltf+json                       gltf;
        application/vnd.ms-pki.stl            ply;
        application/x-protobuf                pbf;
        application/vnd.quantized-mesh        terrain;
        application/vnd.mapbox-vector-tile    mvt;
        video/mp4                             mp4;
        video/mp2t                            ts;
        application/vnd.apple.mpegurl         m3u8;
    }
    default_type application/octet-stream;
    charset utf-8;
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    client_max_body_size 256m;

    # Vditor / Lute、Cesium Workers、pdf.js 等大体积 JS 建议开启压缩
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json
               application/wasm image/svg+xml application/xml;
    # 若有 brotli 模块，可追加：
    # brotli on;
    # brotli_types text/plain text/css application/javascript application/json image/svg+xml;

    server {
        listen       8080;
        server_name  _;
        root         /srv/offline-hub;
        index        index.html;
        autoindex    off;

        # 门户零外链；严格 CSP 可让任何残留公网请求在浏览器控制台立即暴露
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; worker-src 'self' blob:; object-src 'none'; base-uri 'self'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;

        location / {
            try_files $uri $uri/ =404;
        }

        # 字体、Worker、三维模型常被跨端口/跨子域加载，需要 CORS
        location ~* \.(woff2?|ttf|wasm|glb|gltf|ply|pbf|terrain|mvt|png|jpg|jpeg|webp)$ {
            add_header Access-Control-Allow-Origin "*" always;
            add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
            add_header Timing-Allow-Origin "*" always;
            expires 30d;
            add_header Cache-Control "public, immutable";
            try_files $uri =404;
        }

        # 带版本号的组件资源可长缓存；升级版本时改目录名即可自然失效
        location ^~ /vendor/ {
            add_header Access-Control-Allow-Origin "*" always;
            expires 7d;
            add_header Cache-Control "public";
            try_files $uri =404;
        }

        # 入口与清单不做强缓存，避免更新后同事仍看到旧列表
        location ~* ^/(index\.html|data/catalog\.js|vendor/manifest\.js|docs/.*)$ {
            add_header Cache-Control "no-cache, must-revalidate";
            try_files $uri =404;
        }

        location = /health { default_type text/plain; return 200 "ok\n"; }
    }
}
